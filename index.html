const ALL_TAGS = Object.keys(TAG_META);

const state = {
  sort: "reaction",
  query: "",
  tags: new Set(),
  expanded: new Set(),
  gradeMore: new Set()
};

function norm(s){ return s.trim().toLowerCase(); }

function matchesQuery(m, q){
  if(!q) return true;
  const n = norm(q);
  if(norm(m.t).includes(n)) return true;
  return m.tg.some(tag => norm(tag).includes(n));
}

function matchesTags(m){
  if(state.tags.size === 0) return true;
  return m.tg.some(tag => state.tags.has(tag));
}

function getFiltered(){
  return movies.filter(m => matchesQuery(m, state.query) && matchesTags(m));
}

function gradeLabel(g){
  if(g.length === 6) return "전학년";
  const min = Math.min(...g), max = Math.max(...g);
  const consecutive = (max - min + 1) === g.length;
  if(consecutive) return min === max ? `${min}학년` : `${min}~${max}학년`;
  return g.map(x=>x+"학년").join(", ");
}

function tagPill(tag){
  const meta = TAG_META[tag] || {emoji:"🎬", cls:"bg-slate-100 text-slate-600"};
  return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ${meta.cls}">${meta.emoji} ${tag}</span>`;
}

function cardEmoji(m){
  const meta = TAG_META[m.tg[0]];
  return meta ? meta.emoji : "🎬";
}

function renderCard(m){
  const isOpen = state.expanded.has(m.id);
  const cardCls = TIER_CARD[m.ti] || TIER_CARD[2];
  const hotBadge = m.ti === 1 ? `<span class="inline-flex items-center gap-1 text-xs font-bold text-rose-500 mb-1.5">🔥 인기 추천작</span>` : "";
  const cautionHtml = m.c ? `<div class="mt-3 flex gap-1.5 items-start bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 text-xs text-amber-700"><span>⚠️</span><span>${m.c}</span></div>` : "";
  const reasonHtml = m.r.map(line => `<li>${line}</li>`).join("");
  return `
  <div class="rounded-2xl p-4 shadow-sm ${cardCls} transition hover:shadow-md">
    ${hotBadge}
    <div class="flex items-start justify-between gap-2">
      <button data-toggle="${m.id}" class="text-left flex items-start gap-2 group flex-1" aria-expanded="${isOpen}">
        <span class="text-xl leading-none mt-0.5">${cardEmoji(m)}</span>
        <span class="font-display text-base sm:text-lg text-slate-700 group-hover:text-purple-500 transition">${m.t}</span>
      </button>
      <span class="shrink-0 px-2 py-0.5 rounded-full text-xs font-semibold ${GRADE_BADGE[Math.min(...m.g)] || 'bg-slate-100 text-slate-600'}">${gradeLabel(m.g)}</span>
    </div>
    <div class="flex flex-wrap gap-1 mt-2">${m.tg.map(tagPill).join("")}</div>
    <div class="accordion ${isOpen ? 'open' : ''}">
      <ul class="list-disc pl-5 mt-3 space-y-1.5 text-sm text-slate-600 leading-relaxed">${reasonHtml}</ul>
      ${cautionHtml}
    </div>
    <button data-toggle="${m.id}" class="mt-2 text-xs text-purple-400 hover:text-purple-500 font-semibold">${isOpen ? '▲ 접기' : '▼ 추천 이유 보기'}</button>
  </div>`;
}

function renderGrid(list){
  if(list.length === 0){
    return `<div class="text-center py-16 text-slate-400">검색 결과가 없어요 🥲</div>`;
  }
  return `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${list.map(renderCard).join("")}</div>`;
}

function renderGradeSections(filtered){
  const searching = !!state.query || state.tags.size > 0;
  let html = "";
  let totalShown = 0;
  for(let grade = 1; grade <= 6; grade++){
    const inGrade = filtered.filter(m => m.g.includes(grade)).sort((a,b)=>b.s-a.s);
    if(inGrade.length === 0) continue;
    const expanded = state.gradeMore.has(grade) || searching;
    const shown = expanded ? inGrade : inGrade.slice(0,6);
    totalShown += shown.length;
    const moreBtn = (!searching && inGrade.length > 6) ? `
      <button data-more="${grade}" class="mt-3 mx-auto block text-sm font-semibold text-purple-400 hover:text-purple-500">
        ${expanded ? '▲ 접기' : `더보기 (+${inGrade.length - 6})`}
      </button>` : "";
    html += `
    <section class="mb-8">
      <div class="flex items-center gap-2 mb-3">
        <span class="px-3 py-1 rounded-full text-sm font-bold ${GRADE_BADGE[grade]}">${grade}학년</span>
        <span class="text-xs text-slate-400">${inGrade.length}편</span>
      </div>
      ${renderGrid(shown)}
      ${moreBtn}
    </section>`;
  }
  if(html === ""){
    return `<div class="text-center py-16 text-slate-400">검색 결과가 없어요 🥲</div>`;
  }
  return html;
}

function render(){
  const filtered = getFiltered();
  const app = document.getElementById("app");

  document.querySelectorAll(".sort-btn").forEach(btn => {
    const active = btn.dataset.sort === state.sort;
    btn.className = "sort-btn px-4 py-1.5 rounded-full text-sm font-semibold transition " +
      (active ? "bg-purple-400 text-white shadow" : "bg-white text-slate-500 hover:bg-purple-100");
  });

  const tagFilters = document.getElementById("tagFilters");
  tagFilters.innerHTML = ALL_TAGS.map(tag => {
    const meta = TAG_META[tag];
    const active = state.tags.has(tag);
    const activeCls = active ? "ring-2 ring-purple-300 " + meta.cls : meta.cls + " opacity-60 hover:opacity-100";
    return `<button data-tag="${tag}" class="px-2.5 py-1 rounded-full text-xs font-medium transition ${activeCls}">${meta.emoji} ${tag}</button>`;
  }).join("") + (state.tags.size > 0 ? `<button id="clearTags" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-200 text-slate-600 hover:bg-slate-300">✕ 태그 초기화</button>` : "");

  if(state.sort === "grade"){
    app.innerHTML = renderGradeSections(filtered);
  } else {
    const sorted = state.sort === "alpha"
      ? [...filtered].sort((a,b)=>a.t.localeCompare(b.t,'ko'))
      : [...filtered].sort((a,b)=>b.s-a.s);
    app.innerHTML = renderGrid(sorted);
  }

  document.getElementById("countLabel").textContent = `총 ${movies.length}편 중 ${filtered.length}편`;
}

document.getElementById("sortTabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".sort-btn");
  if(!btn) return;
  state.sort = btn.dataset.sort;
  render();
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  state.query = e.target.value;
  render();
});

document.getElementById("tagFilters").addEventListener("click", (e) => {
  const clearBtn = e.target.closest("#clearTags");
  if(clearBtn){ state.tags.clear(); render(); return; }
  const tagBtn = e.target.closest("[data-tag]");
  if(!tagBtn) return;
  const tag = tagBtn.dataset.tag;
  if(state.tags.has(tag)) state.tags.delete(tag); else state.tags.add(tag);
  render();
});

document.getElementById("app").addEventListener("click", (e) => {
  const toggleBtn = e.target.closest("[data-toggle]");
  if(toggleBtn){
    const id = Number(toggleBtn.dataset.toggle);
    if(state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
    render();
    return;
  }
  const moreBtn = e.target.closest("[data-more]");
  if(moreBtn){
    const grade = Number(moreBtn.dataset.more);
    if(state.gradeMore.has(grade)) state.gradeMore.delete(grade); else state.gradeMore.add(grade);
    render();
  }
});

render();
</script>
</body>
</html>
